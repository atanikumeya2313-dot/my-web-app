<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>マイアプリ</title>
  <meta name="theme-color" content="#3b82f6" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f9fafb;
      color: #1f2937;
      min-height: 100vh;
    }
    header {
      padding: 24px 16px 8px;
      max-width: 560px;
      margin: 0 auto;
    }
    header h1 { font-size: 20px; font-weight: 700; margin: 0; }
    header p { font-size: 12px; color: #9ca3af; margin: 4px 0 0; }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 16px 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    a.card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #fff;
      border: 1px solid #f1f1f4;
      border-radius: 16px;
      padding: 18px 16px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      transition: transform .08s ease, box-shadow .15s ease;
    }
    a.card:active { transform: scale(.97); }
    a.card .icon { font-size: 28px; line-height: 1; }
    a.card .name { font-size: 14px; font-weight: 600; }
    a.card .tag {
      font-size: 10px; font-weight: 600; align-self: flex-start;
      padding: 2px 8px; border-radius: 999px;
    }
    .tag.local { background: #ecfdf5; color: #059669; }
    .tag.ext { background: #f3f4f6; color: #9ca3af; }
    footer { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; color: #d1d5db; font-size: 11px; text-align: center; }
    /* dashboard */
    .dash { max-width: 560px; margin: 0 auto; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px; }
    .dash h2 { font-size: 12px; font-weight: 700; color: #6b7280; margin: 0 2px 2px; }
    .d-card { background:#fff; border-radius:14px; padding:13px 15px; text-decoration:none; color:inherit;
      box-shadow:0 1px 2px rgba(0,0,0,.04); border:1px solid #f1f1f4; display:flex; align-items:center; gap:12px;
      transition: transform .08s ease; }
    .d-card:active { transform: scale(.98); }
    .d-ico { font-size:22px; width:26px; text-align:center; flex:none; }
    .d-main { flex:1; min-width:0; display:flex; flex-direction:column; }
    .d-title { font-size:13px; font-weight:700; }
    .d-sub { font-size:12px; color:#6b7280; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .d-val { font-size:15px; font-weight:800; flex:none; }
    .d-val.neg { color:#dc2626; } .d-val.pos { color:#16a34a; }
    .d-pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; flex:none; }
    .d-red { background:#fef2f2; color:#dc2626; }
    .d-amber { background:#fffbeb; color:#d97706; }
    .d-green { background:#f0fdf4; color:#16a34a; }
    .d-indigo { background:#eef2ff; color:#4f46e5; }
  </style>
</head>
<body>
  <header>
    <h1>マイアプリ</h1>
    <p>各アプリへの入口</p>
  </header>
  <section class="dash" id="dash" hidden></section>
  <main>
    <a class="card" href="/quake">
      <span class="icon">🗾</span>
      <span class="name">地震・防災情報</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/kakeibo">
      <span class="icon">💰</span>
      <span class="name">家計簿</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/interest">
      <span class="icon">📈</span>
      <span class="name">資産形成シミュレーター</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/todo">
      <span class="icon">✓</span>
      <span class="name">TODO</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/inventory">
      <span class="icon">📦</span>
      <span class="name">在庫管理</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/diary">
      <span class="icon">✍️</span>
      <span class="name">ひとこと日記</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/cards">
      <span class="icon">📇</span>
      <span class="name">AI暗記カード</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/newshops">
      <span class="icon">🏪</span>
      <span class="name">えひめ新店チェック</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/appnotes">
      <span class="icon">🔧</span>
      <span class="name">アプリ改善メモ</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/books">
      <span class="icon">📚</span>
      <span class="name">AI本だな</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/kondate">
      <span class="icon">🍳</span>
      <span class="name">献立アシスタント</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/subsc">
      <span class="icon">📆</span>
      <span class="name">サブスク管理</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/gym">
      <span class="icon">🏋️</span>
      <span class="name">ジム記録</span>
      <span class="tag local">この入口</span>
    </a>
    <a class="card" href="/hirosaba">
      <span class="icon">🦸</span>
      <span class="name">ヒロサバ育成管理</span>
      <span class="tag local">この入口</span>
    </a>
  </main>
  <footer>「この入口」のアプリは同じドメイン配下でデータを共有します</footer>

  <script>
    // 各アプリの localStorage（同一オリジン）を読んで「きょうの状況」をまとめる。
    // 読み取り専用。データが無いアプリはカードを出さない。
    (function () {
      function ls(key, fallback) {
        try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
        catch (e) { return fallback; }
      }
      function ymd(d) {
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      function yen(n) { return '¥' + Math.round(Math.abs(n)).toLocaleString(); }

      var today = ymd(new Date());
      var month = today.slice(0, 7);

      function card(href, ico, title, sub, right) {
        return '<a class="d-card" href="' + href + '">' +
          '<span class="d-ico">' + ico + '</span>' +
          '<span class="d-main"><span class="d-title">' + esc(title) + '</span>' +
          '<span class="d-sub">' + sub + '</span></span>' +
          (right || '') + '</a>';
      }
      function pill(text, cls) { return '<span class="d-pill ' + cls + '">' + esc(text) + '</span>'; }
      function val(text, cls) { return '<span class="d-val' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</span>'; }

      var cards = [];

      // TODO（今日が期日の単発 ＋ 毎日タスクのうち未完了）
      try {
        var tasks = ls('todo_tasks', []);
        if (Array.isArray(tasks) && tasks.length) {
          var comp = ls('todo_completed', {});
          var doneToday = new Set(Array.isArray(comp[today]) ? comp[today] : []);
          var todays = tasks.filter(function (t) { return t && ((t.date === today) || t.repeat === 'daily'); });
          var remaining = todays.filter(function (t) { return !doneToday.has(t.id); }).length;
          if (todays.length) {
            cards.push(card('/todo', '📝', 'やること',
              remaining > 0 ? '残り ' + remaining + '件 / ' + todays.length + '件' : 'きょうのぶんは完了！',
              remaining > 0 ? pill(remaining, 'd-indigo') : pill('✓', 'd-green')));
          }
        }
      } catch (e) {}

      // ジム（連続日数・次のメニュー）
      try {
        var sessions = ls('gym_sessions', []);
        if (Array.isArray(sessions) && sessions.length) {
          var days = new Set(sessions.map(function (s) { return s.date; }));
          var d = new Date();
          if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
          var streak = 0;
          while (days.has(ymd(d))) { streak++; d.setDate(d.getDate() - 1); }
          var mcount = sessions.filter(function (s) { return s.date && s.date.indexOf(month) === 0; }).length;
          var wentToday = days.has(today);
          var plan = ls('gym_plan', null);
          var sub = '今月 ' + mcount + '回';
          if (plan && Array.isArray(plan.days) && plan.days.length) {
            var last = sessions.find(function (s) { return typeof s.planDay === 'number'; });
            var idx = last ? (last.planDay + 1) % plan.days.length : 0;
            sub = (wentToday ? '今日はお疲れさま！次は ' : '次は ') + 'Day' + (idx + 1) + '・' + esc(plan.days[idx].title);
          } else if (wentToday) { sub = '今日はお疲れさま！（今月 ' + mcount + '回）'; }
          cards.push(card('/gym', '🏋️', 'ジム', sub, pill('🔥' + streak + '日', streak > 0 ? 'd-amber' : 'd-green')));
        }
      } catch (e) {}

      // 在庫（要補充・期限間近）
      try {
        var items = ls('inventory_items', []);
        if (Array.isArray(items) && items.length) {
          var low = items.filter(function (i) { return i.minQuantity > 0 && i.quantity <= i.minQuantity; }).length;
          var t0 = new Date(); t0.setHours(0, 0, 0, 0);
          var expSoon = items.filter(function (i) {
            if (!i.expiryDate) return false;
            var dd = Math.round((new Date(i.expiryDate).getTime() - t0.getTime()) / 86400000);
            return dd <= 7;
          }).length;
          if (low === 0 && expSoon === 0) {
            cards.push(card('/inventory', '📦', '在庫', '不足なし・期限も余裕', pill('✓', 'd-green')));
          } else {
            var parts = [];
            if (low) parts.push('要補充 ' + low + '件');
            if (expSoon) parts.push('期限間近 ' + expSoon + '件');
            cards.push(card('/inventory', '📦', '在庫', parts.join('・'),
              pill(low + expSoon, low ? 'd-red' : 'd-amber')));
          }
        }
      } catch (e) {}

      // 家計簿（今月の収支）
      try {
        var txs = ls('kakeibo_transactions', []);
        if (Array.isArray(txs) && txs.length) {
          var inc = 0, exp = 0, has = false;
          txs.forEach(function (t) {
            if (!t.date || t.date.indexOf(month) !== 0) return;
            has = true;
            if (t.type === 'income') inc += Number(t.amount) || 0;
            else if (t.type === 'expense') exp += Number(t.amount) || 0;
          });
          if (has) {
            var net = inc - exp;
            cards.push(card('/kakeibo', '💰', '今月の収支',
              '収入 ' + yen(inc) + ' / 支出 ' + yen(exp),
              val((net < 0 ? '−' : '') + yen(net), net < 0 ? 'neg' : 'pos')));
          }
        }
      } catch (e) {}

      // サブスク（7日以内に更新）
      try {
        var subs = ls('subsc_subs', []);
        if (Array.isArray(subs) && subs.length) {
          var t1 = new Date(today + 'T00:00:00');
          var soon = subs.filter(function (s) { return s.active; }).map(function (s) {
            var dd = Math.ceil((new Date(s.nextDate + 'T00:00:00').getTime() - t1.getTime()) / 86400000);
            return { name: s.name, days: dd };
          }).filter(function (x) { return x.days <= 7; }).sort(function (a, b) { return a.days - b.days; });
          if (soon.length) {
            var top = soon[0];
            var s0 = top.days <= 0 ? esc(top.name) + ' 本日更新' : esc(top.name) + ' あと' + top.days + '日';
            if (soon.length > 1) s0 += ' ほか' + (soon.length - 1) + '件';
            cards.push(card('/subsc', '📆', 'サブスク更新', s0, pill(soon.length, top.days <= 1 ? 'd-red' : 'd-amber')));
          }
        }
      } catch (e) {}

      // 未バックアップ警告：データがあるのに、そのアプリのクラウド保存記録が無いものを集める。
      // cloud_last_at_<bucket> は push/pull 成功時に記録される（＝一度でも同期したか）。
      try {
        var APPS = [
          { name: 'TODO', href: '/todo', bucket: 'todo', keys: ['todo_tasks'] },
          { name: 'ジム記録', href: '/gym', bucket: 'gym', keys: ['gym_sessions', 'gym_weights'] },
          { name: '在庫管理', href: '/inventory', bucket: 'inventory', keys: ['inventory_items'] },
          { name: '家計簿', href: '/kakeibo', bucket: 'kakeibo', keys: ['kakeibo_transactions'] },
          { name: 'サブスク管理', href: '/subsc', bucket: 'subsc', keys: ['subsc_subs'] },
          { name: '資産形成', href: '/interest', bucket: 'interest', keys: ['interest_calc_v1'] },
          { name: 'AI本だな', href: '/books', bucket: 'books', keys: ['books_books'] },
          { name: 'AI暗記カード', href: '/cards', bucket: 'cards', keys: ['cards_cards', 'cards_decks'] },
          { name: '献立アシスタント', href: '/kondate', bucket: 'kondate', keys: ['kondate_pantry', 'kondate_saved'] },
          { name: 'ひとこと日記', href: '/diary', bucket: 'diary', keys: ['hitokoto_entries'] },
          { name: 'アプリ改善メモ', href: '/appnotes', bucket: 'appnotes', keys: ['appnotes_notes'] }
        ];
        function hasData(keys) {
          for (var i = 0; i < keys.length; i++) {
            var v = ls(keys[i], null);
            if (Array.isArray(v) && v.length) return true;
            if (v && typeof v === 'object' && Object.keys(v).length) return true;
          }
          return false;
        }
        var notBacked = APPS.filter(function (a) {
          if (!hasData(a.keys)) return false;                 // データが無いアプリは対象外
          var at = null;
          try { at = localStorage.getItem('cloud_last_at_' + a.bucket); } catch (e) {}
          return !at;                                         // 一度も同期していない
        });
        if (notBacked.length) {
          var warn = document.createElement('section');
          warn.className = 'dash';
          var names = notBacked.map(function (a) { return '<a href="' + a.href + '" style="color:#b45309;font-weight:700;text-decoration:underline;">' + esc(a.name) + '</a>'; }).join('、');
          warn.innerHTML =
            '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px 14px;">' +
            '<div style="font-size:13px;font-weight:700;color:#b45309;">⚠️ まだクラウド保存していないアプリ</div>' +
            '<div style="font-size:12px;color:#92400e;margin-top:4px;line-height:1.6;">' + names + '</div>' +
            '<div style="font-size:11px;color:#a16207;margin-top:6px;">この端末だけにデータがあります。各アプリの「☁️同期」でコードを入れ⚡自動同期をオンにすると、機種変更や再インストールでも復元できます。</div>' +
            '</div>';
          var dashEl = document.getElementById('dash');
          dashEl.parentNode.insertBefore(warn, dashEl.nextSibling);
        }
      } catch (e) {}

      var dash = document.getElementById('dash');
      if (cards.length) {
        dash.innerHTML = '<h2>きょうの状況</h2>' + cards.join('');
        dash.hidden = false;
      }
    })();
  </script>
</body>
</html>
